[package]
name = "tezbar-text-rewrap"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT AND Apache-2.0"
repository = "https://github.com/almatkai/text-rewrap"
description = "Compiled-in Native V2 Text Rewrap adapter and compatibility harness"
include = ["/src/*.rs", "/tests/*.rs", "/fixtures/beta/*", "/fixtures/original/src/**/*.ts", "/fixtures/original/src/**/*.tsx", "/fixtures/original/package.json", "/fixtures/original/raycast-env.d.ts", "/fixtures/*.json", "/assets/*.png", "/tools/*.mjs", "/tools/package.json", "/tools/pnpm-lock.yaml", "/tools/pnpm-workspace.yaml", "/extension-v2.json", "/Cargo.lock", "/README.md", "/NOTICES", "/LICENSE", "/Cargo.toml"]

[features]
default = []
beta-contract = ["dep:tokio", "dep:tempfile", "dep:log"]

[[test]]
name = "adapter"
required-features = ["beta-contract"]

[[test]]
name = "renderer_views"
required-features = ["beta-contract"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
num-bigint = "0.4"
num-traits = "0.2"
ryu-js = "1"
# Dependencies below compile the byte-exact beta SDK/common contract harness.
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "macros"] }
tempfile = { version = "=3.23.0", optional = true }
log = { version = "0.4", optional = true }

[dev-dependencies]
sha2 = "0.10"
