[package]
name = "tezbar-text-rewrap-process"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT AND Apache-2.0"
description = "Standalone Rust Text Rewrap process extension for Tezbar"
repository = "https://github.com/almatkai/text-rewrap"
publish = false

[[bin]]
name = "tezbar-text-rewrap"
path = "rust/main.rs"

[lib]
name = "text_rewrap_process"
path = "rust/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "sync", "time"] }
tezbar-extension-sdk = { git = "https://github.com/almatkai/tezbar-extension-sdk-rust.git", rev = "aaec571673ab64a85a136cf6bd054ef660c4d93c" }
# Existing reviewed v2 engine (default features: production engine only).
tezbar-text-rewrap = { path = "v2" }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "time"] }
